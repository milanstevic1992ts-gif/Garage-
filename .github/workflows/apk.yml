name: Build Garage APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GARAGE_KEYSTORE_B64: ${{ secrets.GARAGE_KEYSTORE_B64 }}
      GARAGE_KEYSTORE_PASSWORD: ${{ secrets.GARAGE_KEYSTORE_PASSWORD }}
      GARAGE_KEY_ALIAS: ${{ secrets.GARAGE_KEY_ALIAS }}
      GARAGE_KEY_PASSWORD: ${{ secrets.GARAGE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Garage self-test
        run: npm run check

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          bash scripts/patch-android.sh

      - name: Build unsigned release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign with permanent Garage key
        if: env.GARAGE_KEYSTORE_B64 != ''
        run: |
          echo "$GARAGE_KEYSTORE_B64" | base64 --decode > garage-release.jks

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          INPUT="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          "$ZIPALIGN" -f -P 16 -v 4 "$INPUT" garage-aligned.apk

          "$APKSIGNER" sign             --ks garage-release.jks             --ks-key-alias "$GARAGE_KEY_ALIAS"             --ks-pass "pass:$GARAGE_KEYSTORE_PASSWORD"             --key-pass "pass:$GARAGE_KEY_PASSWORD"             --out garage.apk             garage-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs garage.apk

      - name: Signing key not configured
        if: env.GARAGE_KEYSTORE_B64 == ''
        run: |
          echo "Firma permanente non configurata nei GitHub Actions Secrets."
          echo "Per sicurezza nessun APK installabile viene pubblicato con una chiave temporanea."

      - uses: actions/upload-artifact@v4
        if: env.GARAGE_KEYSTORE_B64 != ''
        with:
          name: garage-apk-signed
          path: garage.apk
          retention-days: 30
